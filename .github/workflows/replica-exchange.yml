name: Cross-OS immutable replica exchange

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Prepare one canonical seed and completed immutable bundle
        run: python tests/replica_exchange_scenario.py prepare --output "${{ runner.temp }}/exchange-seed"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: exchange-seed
          path: ${{ runner.temp }}/exchange-seed/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  produce:
    needs: prepare
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            replica: windows
          - os: macos-latest
            replica: mac
          - os: ubuntu-latest
            replica: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v8.0.2
        with:
          name: exchange-seed
          path: ${{ runner.temp }}/exchange-seed
      - name: Independently mutate the same seed on the actual runner OS
        run: python tests/replica_exchange_scenario.py produce --mode ci --seed "${{ runner.temp }}/exchange-seed" --replica "${{ matrix.replica }}" --output "${{ runner.temp }}/exchange-replica-${{ matrix.replica }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: exchange-replica-${{ matrix.replica }}
          path: ${{ runner.temp }}/exchange-replica-${{ matrix.replica }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [prepare, produce]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v8.0.2
        with:
          name: exchange-seed
          path: ${{ runner.temp }}/exchange-seed
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: exchange-replica-*
          path: ${{ runner.temp }}/exchange-replicas
          merge-multiple: false
      - name: Verify six arrival orders, retries, policy, history and explicit resolution
        run: python tests/replica_exchange_scenario.py verify --mode ci --seed "${{ runner.temp }}/exchange-seed" --replicas "${{ runner.temp }}/exchange-replicas" --output "${{ runner.temp }}/exchange-verification"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: exchange-verification
          path: ${{ runner.temp }}/exchange-verification/report.json
          if-no-files-found: error
          retention-days: 7
